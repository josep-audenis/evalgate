[project]
name = "evalgate"
version = "0.0.1"
description = "Local-first AI regression testing and release decision engine."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Josep Audenis" }]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.6",
    "pyyaml>=6",
]

[project.scripts]
evalgate = "evalgate.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "types-pyyaml"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
packages = ["evalgate"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.format]
exclude = ["docs/**"]
