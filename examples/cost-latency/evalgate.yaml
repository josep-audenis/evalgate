# Scenario: a bigger model answers better but is slower and pricier.
# Quality may not drop; latency and cost may each rise at most 20%.
version: 1

metrics:
  quality:
    path: scores.quality
    direction: maximize
    max_mean_regression_abs: 0.01
  latency:
    path: metrics.latency_ms
    direction: minimize
    max_mean_regression_pct: 20
  cost:
    path: metrics.cost_usd
    direction: minimize
    max_mean_regression_pct: 20

checks:
  required:
    - grounded
