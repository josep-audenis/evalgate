version: 1

comparison:
  # Six demo cases; real suites should have far more.
  min_compared_cases: 6

metrics:
  quality:
    path: scores.helpful
    direction: maximize
    max_mean_regression_abs: 0.25

checks:
  # Produced by LLM judges (see make_runs.py).
  required:
    - faithful
  max_new_failures: 0
