version: 1

comparison:
  # Five demo cases; real suites should have far more.
  min_compared_cases: 5

metrics:
  quality:
    path: scores.quality
    direction: maximize
    max_mean_regression_abs: 0.02

checks:
  # Produced by EvalGate's built-in evaluators (see make_runs.py).
  required:
    - is_json
    - answer_shape
    - concise
    - no_ai_disclaimer
  max_new_failures: 0
